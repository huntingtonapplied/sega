[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "sega"
authors = [{name = "FLEET", email = "team@sega.dev"}]
description = "Unified CI/CD platform for multi-domain projects"
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "click>=8.0",
    "colorlog>=6.7.0",
    "structlog>=23.1.0",
    "pyyaml>=6.0",
    "toml; python_version < '3.11'",
    "docker>=6.0",
    "kubernetes>=25.0",
    "ansible-runner>=2.3",
    "boto3>=1.26",
    "psutil>=5.9",
    "pyzmq>=22.0",
    "protobuf>=4.21",
    "GitPython>=3.1",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
    "tabulate>=0.9",
    "grpcio>=1.50.0",
    "aiohttp>=3.8",
    "httpx>=0.24.0",
    "requests>=2.28.0",
    "cryptography>=41.0",
]
dynamic = ["version"]

[project.scripts]
sega = "sega.cli.main:cli"

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "moto",
]
dashboard = [
    "dash>=2.14",
    "dash-bootstrap-components>=1.5",
    "flask>=2.3",
    "itsdangerous>=2.1",
]
data = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]
grpc = [
    "grpcio-tools>=1.50.0",
]
packaging = [
    "nuitka",
]

[project.urls]
Documentation = "https://github.com/huntingtonapplied/sega#readme"
Source = "https://github.com/huntingtonapplied/sega"

[tool.flit.sdist]
include = [
    "sega/system/sysmon/**/*",
    "sega/system/sysnc/**/*",
]

[tool.flit.module]
name = "sega"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*_pb.py", "*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
