name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the sega package
        run: |
          python -m pip install --upgrade pip
          pip install -e engine

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check engine/sega || true   # advisory until the lint baseline is clean

      - name: Run unit tests
        env:
          # Generated protobuf modules need the pure-python parser on newer protobuf.
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          pip install pytest
          pytest engine/tests -q
