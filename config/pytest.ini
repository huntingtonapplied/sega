[tool:pytest]
# SG Platform Test Configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery patterns
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src/sega
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=

# Custom markers
markers =
    integration: Integration tests
    postgres: Tests requiring PostgreSQL database
    redis: Tests requiring Redis
    slow: Slow running tests (> 5 seconds)
    security: Security-related tests
    deployment: Deployment-related tests
    telemetry: Telemetry reporting tests
    
# Test filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    
# Minimum version requirements
minversion = .

# Parallel execution settings
# addopts = --numprocesses=auto  # Uncomment for parallel execution

# Test environment variables
env =
    TSTING = true
    SG_NVIRONMNT = development
    NOD_NV = development
    HL_SHRD_NV = /home/testuser/fleet/_internal/environments/_internal/environments/fleet_venv
    LOG_LVL = INO