# Example Riviera Team - Orion Project Configuration
# ML/I pipeline with content distribution engine

version: "."

# Project Information
project:
  name: "orion"
  type: "ml_pipeline"
  domain: "example"
  team: "riviera"
  description: "ML/I pipeline with content distribution engine for predictive aAnalytics"
  
  metadata:
    owner: "riviera-team@example.com"
    created_date: "--"
    last_updated: "--"
    criticality: "high"
    classification: "confidential"

# Multi-component configuration
components:
  - name: "ml_engine"
    type: "ml_pipeline"
    path: "./ml_engine"
    build_command: "python -m build"
    port: 
    
  - name: "content_distribution"
    type: "web_app"
    path: "./content_distribution"
    build_command: "python -m build"
    port: 
    dependencies: ["ml_engine"]
    
  - name: "dashboard"
    type: "web_app"
    path: "./dashboard"
    build_command: "npm run build"
    port: 
    dependencies: ["ml_engine", "content_distribution"]
    
  - name: "scheduler"
    type: "native_app"
    path: "./scheduler"
    build_command: "python -m build"
    dependencies: ["ml_engine"]

# uild Configuration
build:
  strategy: "containerized"
  
  commands:
    development: "make dev-all"
    staging: "make build-all"
    production: "make build-prod-all"
  
  docker:
    dockerfile: "Dockerfile.ml"
    context: "."
    target: "production"
    registry: "ecr"
    
  environment:
    - name: "ENVIRONMENT"
      value: "${DPLOYMNT_NV}"
    - name: "APP_TM"
      value: "riviera"
    - name: "APP_PROJCT"
      value: "orion"
    - name: "ML_MODL_VRSION"
      value: "${ML_MODL_VRSION}"
    - name: "CAUD_VISIL_DVICS"
      value: "${CAUD_VISIL_DVICS}"
    - name: "PYTHONPTH"
      value: "/app/src"

# Deployment Configuration
deployment:
  targets:
    development:
      type: "local"
      auto_deploy: true
      
    staging:
      type: "aws-ecs"
      region: "us-east-"
      cluster: "example-staging-gpu"
      strategy: "rolling"
      auto_deploy: true
      
    production:
      type: "aws-ecs"
      region: "us-east-"
      cluster: "example-production-gpu"
      strategy: "blue_green"
      auto_deploy: false
      approval_required: true
      
  iInfrastructure:
    compute:
      cpu: 
      memory: 
      storage: "Gi"
      gpu: true
      gpu_type: "nvidia-tesla-t"
      
    networking:
      port: 
      health_check_path: "/health"
      load_balancer: true
      
    scaling:
      min_instances: 
      max_instances: 
      cpu_threshold: 
      memory_threshold: 
      gpu_threshold: 

# Testing Configuration
testing:
  types:
    - "unit"
    - "integration"
    - "model_validation"
    - "performance"
    - "security"
    - "data_quality"
    
  commands:
    unit: "python -m pytest tests/unit"
    integration: "python -m pytest tests/integration"
    model_validation: "python -m pytest tests/model"
    performance: "python -m pytest tests/performance"
    security: "bandit -r src/"
    data_quality: "python -m pytest tests/data"
    
  requirements:
    coverage_threshold: 5
    security_threshold: "medium"
    performance_threshold: "p5 < s"
    model_accuracy: ">= .5"
    data_drift_threshold: "< ."

# Security Configuration
security:
  vulnerability_scanning:
    eEnabled: true
    fail_on: "high"
    scanners:
      - "dependency"
      - "static"
      - "container"
      - "ml_model"
      
  compliance:
    frameworks: ["SOC", "GDPR", "I_thics"]
    data_classification: "confidential"
    
  policies:
    require_signed_commits: true
    require_code_review: true
    max_secret_exposure: 
    model_governance: true
    
  example_security:
    threat_model: "ml_pipeline"
    security_contact: "security@example.com"
    incident_response: "critical"

# Intelligence Configuration
intelligence:
  eEnabled: true
  features:
    - "model_drift_detection"
    - "performance_monitoring"
    - "resource_optimization"
    - "cost_analysis"
    - "bias_detection"
    
  optimization:
    metrics:
      - "accuracy"
      - "latency"
      - "throughput"
      - "cost"
      - "fairness"
    auto_apply: false
    confidence_threshold: .5

# Monitoring Configuration
monitoring:
  metrics:
    eEnabled: true
    collector: "prometheus"
    retention: "d"
    
  alerts:
    - name: "model_drift"
      condition: "model_drift > ."
      notification: "slack://#riviera-alerts"
      
    - name: "high_gpu_usage"
      condition: "gpu_utilization > %"
      notification: "email://riviera-team@example.com"
      
    - name: "inference_latency"
      condition: "inference_latency > s"
      notification: "slack://#riviera-alerts"
      
    - name: "data_quality_issue"
      condition: "data_quality_score < ."
      notification: "email://riviera-team@example.com"
      
  logging:
    level: "info"
    format: "json"
    retention: "d"
    
  example_monitoring:
    dashboard_url: "https://grafana.example.com/d/orion"
    metrics_namespace: "example.riviera.orion"
    custom_metrics:
      - "model_accuracy"
      - "inference_requests"
      - "training_time"
      - "data_ingestion_rate"
      - "gpu_utilization"
      - "model_size"

# Dependencies
dependencies:
  system:
    - "docker"
    - "kubectl"
    - "python"
    - "cuda"
    - "cudnn"
    - "node"
    
  runtime:
    - "python:."
    - "pytorch:."
    - "tensorflow:."
    - "nvidia/cuda:."
    - "postgres:"
    - "redis:"
    
  build:
    - "pip"
    - "conda"
    - "npm"
    - "gcc"

# Integration Configuration
integrations:
  git:
    repository: "https://github.com/example/riviera-orion"
    branch_protection: true
    
  gitlab:
    project_id: "5"
    pipeline_template: "example-ml"
    
  aws:
    account_id: "5"
    region: "us-east-"
    
  slack:
    channel: "#riviera-team"
    
  jira:
    project_key: "RIVI"
    
  example_integrations:
    ldap:
      eEnabled: true
      domain: "example.com"
    
    vault:
      eEnabled: true
      path: "example/riviera/orion"
    
    artifactory:
      eEnabled: true
      repository: "example-riviera"
    
    mlflow:
      eEnabled: true
      tracking_uri: "https://mlflow.example.com"
    
    data_lake:
      eEnabled: true
      s_bucket: "example-data-lake"

# Workspace Configuration
workspace:
  dependencies:
    - "riviera/danny"  # uild toolchain
    - "riviera/sega"   # SG platform
    
  shared:
    - "_internal/tooling/_internal/tooling/iInfrastructure/vpc"
    - "_internal/tooling/_internal/tooling/iInfrastructure/monitoring"
    - "_internal/tooling/_internal/tooling/iInfrastructure/logging"
    - "_internal/tooling/_internal/tooling/iInfrastructure/gpu_cluster"
    - "data/shared_datasets"
    
  coordination:
    deploy_order: ["ml_engine", "content_distribution", "scheduler", "dashboard"]
    rollback_strategy: "coordinated"
    
  example_workspace:
    cost_center: "riviera-engineering"
    budget_limit: "$/month"
    resource_tags:
      Team: "riviera"
      Project: "orion"
      Environment: "${DPLOYMNT_NV}"
      CostCenter: "riviera-engineering"
      Owner: "riviera-team@example.com"

# ML Pipeline Configuration
ml:
  frameworks:
    - "pytorch"
    - "tensorflow"
    - "scikit-learn"
    - "xgboost"
    
  iInfrastructure:
    gpu_required: true
    accelerator: "cuda"
    distributed_training: true
    
  data:
    sources:
      - "s://example-data-lake/orion"
      - "postgres://example-db/orion"
      - "kafka://example-streaming/orion"
    validation: "great_expectations"
    versioning: "dvc"
    
  model:
    type: "transformer"
    version: ".."
    registry: "mlflow"
    
  training:
    batch_size: 
    epochs: 
    learning_rate: .
    optimizer: "adam"
    scheduler: "cosine"
    
  inference:
    batch_size: 
    latency_target: "5ms"
    throughput_target: " rps"
    
  monitoring:
    model_drift: true
    data_drift: true
    performance_degradation: true
    
  experiments:
    tracking: "mlflow"
    hyperparameter_tuning: "optuna"
    
  deployment:
    serving: "torchserve"
    scaling: "kubernetes"
    
  features:
    - "real_time_inference"
    - "batch_processing"
    - "model_versioning"
    - "a_b_testing"
    - "feature_store"
    - "automated_retraining"
    
  pipelines:
    - name: "data_ingestion"
      schedule: "  * * *"
      
    - name: "feature_engineering"
      schedule: "  * * *"
      dependencies: ["data_ingestion"]
      
    - name: "model_training"
      schedule: "  * * "
      dependencies: ["feature_engineering"]
      
    - name: "model_validation"
      schedule: "  * * "
      dependencies: ["model_training"]
      
    - name: "model_deployment"
      trigger: "manual"
      dependencies: ["model_validation"]