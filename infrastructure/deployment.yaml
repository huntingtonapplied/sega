# ================================
# PROJECT DEPLOYMENT CONFIGURATION
# Project: SEGA - Security and Guardian Platform
# File: infrastructure/deployment.yaml
# Purpose: Complete deployment configurations and procedures
# ================================

project:
  name: "SEGA"
  description: "Security and Guardian Platform for portfolio-level CI/CD management"
  deployment_approach: "Cloud-native deployment with containerization, Infrastructure as code, and multi-environment support"

# Deployment Environments
environments:

  development:
    description: "Local development environment for feature development"
    infrastructure:
      type: "local"
      requirements:
        - "Docker Desktop 4.0+"
        - "Docker Compose 2.0+"
        - "Python 3.11+"
        - "Node.js 18+"
        - "8GB RAM recommended"
        - "20GB storage available"
        
    deployment_method: "docker-compose"
    configuration:
      replicas: 1
      cpu_limit: "2 cores"
      memory_limit: "4G"
      storage: "local volumes"
      
    services:
      sega_api:
        image: "sega:dev"
        ports: ["8015:8000"]
        volumes: ["./:/app", "sega_data:/app/data"]
        environment_file: ".env.dev"
        command: "python -m sega.api.main --reload"
        
      sega_worker:
        image: "sega:dev"
        volumes: ["./:/app"]
        environment_file: ".env.dev"
        command: "celery -A sega.worker worker --loglevel=info"
        depends_on: ["redis", "postgresql"]
        
      sega_scheduler:
        image: "sega:dev"
        volumes: ["./:/app"]
        environment_file: ".env.dev"
        command: "celery -A sega.worker beat --loglevel=info"
        depends_on: ["redis", "postgresql"]
        
      sega_frontend:
        image: "sega-frontend:dev"
        ports: ["3015:3000"]
        volumes: ["./frontend:/app"]
        environment_file: ".env.dev"
        command: "npm run dev"
        
      postgresql:
        image: "postgres:15"
        ports: ["5432:5432"]
        volumes: ["postgres_data:/var/lib/postgresql/data"]
        environment:
          POSTGRES_DB: "sega_dev"
          POSTGRES_USER: "sega_dev"
          POSTGRES_PASSWORD: "dev_password"
          
      redis:
        image: "redis:7-alpine"
        ports: ["6379:6379"]
        volumes: ["redis_data:/data"]
        
      influxdb:
        image: "influxdb:2.7"
        ports: ["8086:8086"]
        volumes: ["influxdb_data:/var/lib/influxdb"]
        environment:
          DOCKER_INFLUXDB_INIT_MODE: "setup"
          DOCKER_INFLUXDB_INIT_USERNAME: "admin"
          DOCKER_INFLUXDB_INIT_PASSWORD: "dev_password"
          DOCKER_INFLUXDB_INIT_ORG: "example"
          DOCKER_INFLUXDB_INIT_BUCKET: "sega"

  testing:
    description: "Automated testing environment for CI/CD pipelines"
    infrastructure:
      type: "docker"
      ci_platform: "GitLab CI"
      
    deployment_method: "docker-compose"
    configuration:
      replicas: 1
      cpu_limit: "1 core"
      memory_limit: "2G"
      
    services:
      sega_api:
        image: "sega:${CI_COMMIT_SHA}"
        environment_file: ".env.test"
        command: "python -m pytest tests/ --cov=sega"
        
      test_database:
        image: "postgres:15"
        environment:
          POSTGRES_DB: "sega_test"
          POSTGRES_USER: "sega_test"
          POSTGRES_PASSWORD: "test_password"
          
      test_redis:
        image: "redis:7-alpine"

  staging:
    description: "Pre-production staging environment for integration testing"
    infrastructure:
      type: "aws_ecs"
      cluster: "sega-staging-cluster"
      vpc: "Custom VPC with private subnets"
      availability_zones: ["us-east-1a", "us-east-1b"]
      
    deployment_method: "aws_cdk"
    configuration:
      replicas: 2
      cpu: "1 vCPU"
      memory: "2G"
      auto_scaling: true
      min_capacity: 2
      max_capacity: 6
      
    services:
      sega_api:
        image: "sega:staging-latest"
        task_definition: "sega-api-staging"
        service_name: "sega-api-service"
        desired_count: 2
        cpu: 512
        memory: 1024
        ports: [8000]
        health_check:
          path: "/health"
          interval: 30
          timeout: 5
          healthy_threshold: 3
          unhealthy_threshold: 2
        environment:
          - name: "SEGA_ENV"
            value: "staging"
          - name: "DATABASE_URL"
            valueFrom: "arn:aws:ssm:us-east-1:account:parameter/sega/staging/database-url"
          - name: "REDIS_URL"
            valueFrom: "arn:aws:ssm:us-east-1:account:parameter/sega/staging/redis-url"
            
      sega_worker:
        image: "sega:staging-latest"
        task_definition: "sega-worker-staging"
        service_name: "sega-worker-service"
        desired_count: 2
        cpu: 512
        memory: 1024
        
      sega_scheduler:
        image: "sega:staging-latest"
        task_definition: "sega-scheduler-staging"
        service_name: "sega-scheduler-service"
        desired_count: 1
        cpu: 256
        memory: 512
        
      sega_frontend:
        image: "sega-frontend:staging-latest"
        task_definition: "sega-frontend-staging"
        service_name: "sega-frontend-service"
        desired_count: 2
        cpu: 256
        memory: 512
        ports: [3000]
        
    databases:
      postgresql:
        engine: "postgres"
        version: "15.4"
        instance_class: "db.t3.medium"
        allocated_storage: 20
        backup_retention: 7
        multi_az: false
        
      redis:
        engine: "redis"
        version: "7.0"
        node_type: "cache.t3.micro"
        num_cache_nodes: 1
        
    load_balancer:
      type: "Application"
      scheme: "internet-facing"
      listeners:
        - port: 443
          protocol: "HTTPS"
          ssl_certificate: "*.staging.example.com"
        - port: 80
          protocol: "HTTP"
          redirect_to_https: true

  production:
    description: "Production environment for live deployment"
    infrastructure:
      type: "aws_ecs"
      cluster: "sega-production-cluster"
      vpc: "Production VPC with multi-AZ setup"
      availability_zones: ["us-east-1a", "us-east-1b", "us-east-1c"]
      
    deployment_method: "aws_cdk"
    configuration:
      replicas: 3
      cpu: "2 vCPU"
      memory: "4G"
      
    high_availability:
      enabled: true
      auto_scaling: true
      min_capacity: 3
      max_capacity: 12
      target_cpu_utilization: 70
      target_memory_utilization: 80
      
    services:
      sega_api:
        image: "sega:production-v1.0.0"
        task_definition: "sega-api-production"
        service_name: "sega-api-service"
        desired_count: 3
        cpu: 1024
        memory: 2048
        ports: [8000]
        health_check:
          path: "/health"
          interval: 30
          timeout: 5
          healthy_threshold: 3
          unhealthy_threshold: 2
        auto_scaling:
          target_cpu: 70
          target_memory: 80
          scale_in_cooldown: 300
          scale_out_cooldown: 60
        environment:
          - name: "SEGA_ENV"
            value: "production"
          - name: "DATABASE_URL"
            valueFrom: "arn:aws:secretsmanager:us-east-1:account:secret:sega/prod/database-url"
            
      sega_worker:
        image: "sega:production-v1.0.0"
        task_definition: "sega-worker-production"
        service_name: "sega-worker-service"
        desired_count: 3
        cpu: 1024
        memory: 2048
        auto_scaling:
          metric: "queue_length"
          target_value: 100
          
      sega_scheduler:
        image: "sega:production-v1.0.0"
        task_definition: "sega-scheduler-production"
        service_name: "sega-scheduler-service"
        desired_count: 2
        cpu: 256
        memory: 512
        
      sega_frontend:
        image: "sega-frontend:production-v1.0.0"
        task_definition: "sega-frontend-production"
        service_name: "sega-frontend-service"
        desired_count: 3
        cpu: 256
        memory: 512
        ports: [3000]
        
    databases:
      postgresql:
        engine: "postgres"
        version: "15.4"
        instance_class: "db.r6g.xlarge"
        allocated_storage: 100
        max_allocated_storage: 500
        backup_retention: 30
        multi_az: true
        read_replicas: 2
        performance_insights: true
        
      redis:
        engine: "redis"
        version: "7.0"
        node_type: "cache.r6g.large"
        num_cache_clusters: 2
        replication_group: true
        automatic_failover: true
        
    cdn:
      provider: "cloudfront"
      origins:
        - domain: "sega.example.com"
          path_patterns: ["/static/*", "/media/*"]
      cache_behaviors:
        - path_pattern: "/static/*"
          ttl: 31536000  # 1 year
        - path_pattern: "/media/*"
          ttl: 86400  # 1 day
          
    monitoring:
      cloudwatch: true
      xray: true
      container_insights: true
      prometheus: true
      grafana: true

# Container Configuration
containerization:

  base_images:
    python_api:
      base_image: "python:3.11-slim"
      multi_stage: true
      security_scanning: true
      size_optimization: true
      
    node_frontend:
      base_image: "node:18-alpine"
      multi_stage: true
      security_scanning: true
      nginx_serving: true
      
  dockerfile_api:
    location: "Dockerfile"
    stages:
      builder:
        base: "python:3.11-slim"
        steps:
          - "Install build dependencies"
          - "Copy requirements files"
          - "Install Python dependencies"
          - "Run security scans"
          
      runtime:
        base: "python:3.11-slim"
        steps:
          - "Install runtime dependencies"
          - "Create non-root user"
          - "Copy Application from builder"
          - "Set proper permissions"
          - "Configure health checks"
        security:
          - "Run as non-root user"
          - "Remove package managers"
          - "Set read-only filesystem"
          
  dockerfile_frontend:
    location: "frontend/Dockerfile"
    stages:
      builder:
        base: "node:18-alpine"
        steps:
          - "Install dependencies"
          - "Copy source code"
          - "Build production bundle"
          - "Run tests and linting"
          
      runtime:
        base: "nginx:alpine"
        steps:
          - "Copy built assets"
          - "Configure Nginx"
          - "Set up health checks"
          - "Configure security headers"
          
  image_optimization:
    techniques:
      - "Multi-stage builds for smaller images"
      - "Layer caching optimization"
      - "Minimal base images (Alpine/Distroless)"
      - "Security vulnerability scanning"
      - "Image signing with Cosign"
      - "SBOM generation"
      
  registry:
    development: "localhost:5000"
    staging: "<account>.dkr.ecr.us-east-1.amazonaws.com/sega"
    production: "<account>.dkr.ecr.us-east-1.amazonaws.com/sega"
    
    security:
      vulnerability_scanning: "Trivy on push"
      image_signing: "Cosign with keyless signing"
      access_control: "IAM-based registry access"

# CI/CD Pipeline
cicd_pipeline:

  trigger_conditions:
    - "Push to main branch"
    - "Pull request to main"
    - "Tag creation (v*.*.*)"
    - "Manual deployment trigger"
    - "Scheduled security scans (daily)"
    - "Dependency update PRs"
    
  pipeline_stages:
    
    validation_and_testing:
      description: "Code validation, testing, and quality checks"
      parallel_execution: true
      
      jobs:
        code_quality:
          steps:
            - name: "checkout_code"
              action: "actions/checkout@v4"
              
            - name: "setup_python"
              action: "actions/setup-python@v5"
              version: "3.11"
              
            - name: "install_dependencies"
              command: "poetry install"
              
            - name: "run_linting"
              commands:
                - "ruff check src/"
                - "black --check src/"
                - "mypy src/"
                
            - name: "run_tests"
              command: "pytest --cov=sega tests/"
              coverage_threshold: 80
              
        frontend_quality:
          steps:
            - name: "setup_node"
              action: "actions/setup-node@v4"
              version: "18"
              
            - name: "install_dependencies"
              command: "cd frontend && npm ci"
              
            - name: "run_linting"
              command: "cd frontend && npm run lint"
              
            - name: "run_tests"
              command: "cd frontend && npm test -- --coverage"
              
        security_scanning:
          steps:
            - name: "dependency_check"
              tools:
                - "safety check"
                - "cd frontend && npm audit"
                
            - name: "code_security_scan"
              tools:
                - "bandit -r src/"
                - "semgrep --config=auto src/"
                
    build_and_scan:
      description: "Build container images and scan for vulnerabilities"
      depends_on: ["validation_and_testing"]
      
      jobs:
        build_images:
          steps:
            - name: "build_api_image"
              command: "docker build -t sega:${{ github.sha }} ."
              
            - name: "build_frontend_image"
              command: "docker build -t sega-frontend:${{ github.sha }} frontend/"
              
            - name: "scan_images"
              tools:
                - "trivy image sega:${{ github.sha }}"
                - "trivy image sega-frontend:${{ github.sha }}"
              fail_on: "HIGH,CRITICAL"
              
            - name: "sign_images"
              tool: "cosign"
              keyless: true
              
            - name: "push_to_registry"
              condition: "on_success"
              registries:
                - "staging"
                - "production"
                
    deploy_staging:
      description: "Deploy to staging environment"
      trigger: "on_main_branch"
      environment: "staging"
      
      jobs:
        deploy_infrastructure:
          steps:
            - name: "deploy_Infrastructure"
              tool: "aws-cdk"
              command: "cdk deploy StagingStack --require-approval never"
              
            - name: "update_services"
              tool: "aws-cli"
              commands:
                - "aws ecs update-service --cluster sega-staging --service sega-api-service --force-new-deployment"
                - "aws ecs update-service --cluster sega-staging --service sega-frontend-service --force-new-deployment"
                
            - name: "run_migrations"
              command: |
                aws ecs run-task \
                  --cluster sega-staging \
                  --task-definition sega-migrate:latest \
                  --launch-type FARGATE \
                  --network-configuration "awsvpconfiguration={subnets=[subnet-xxx],securityGroups=[sg-xxx]}"
                  
            - name: "health_checks"
              timeout: "5 minutes"
              endpoints:
                - "https://staging.sega.example.com/health"
                - "https://staging.sega.example.com/api/v1/health"
                
            - name: "integration_tests"
              command: "pytest tests/integration/ --env=staging"
              
            - name: "performance_tests"
              tool: "k6"
              script: "tests/performance/load_test.js"
              
    deploy_production:
      description: "Deploy to production environment"
      trigger: "manual_approval"
      environment: "production"
      approval_required: true
      approvers: ["release-team", "platform-team"]
      
      jobs:
        pre_deployment:
          steps:
            - name: "pre_deployment_validation"
              checks:
                - "Database migration compatibility"
                - "API backward compatibility"
                - "Feature flag configurations"
                - "Third-party service availability"
                - "Capacity planning verification"
                
            - name: "create_deployment_plan"
              tool: "terraform"
              command: "terraform plan -out=production.tfplan"
              
        blue_green_deployment:
          strategy: "blue_green"
          steps:
            - name: "deploy_green_environment"
              description: "Deploy new version to green environment"
              
            - name: "warm_up_services"
              description: "Pre-warm caches and connections"
              command: "python scripts/warm_up.py"
              
            - name: "smoke_tests"
              description: "Run smoke tests on green environment"
              timeout: "5 minutes"
              
            - name: "load_balancer_switch"
              description: "Switch traffic to green environment"
              gradual: true
              percentages: [10, 25, 50, 100]
              wait_between: "5 minutes"
              
            - name: "monitor_deployment"
              duration: "30 minutes"
              metrics:
                - "Error rate < 0.1%"
                - "Response time < 500ms p95"
                - "Memory usage < 80%"
                - "CPU usage < 80%"
                
            - name: "complete_deployment"
              description: "Complete deployment or rollback"
              rollback_triggers:
                - "Error rate > 5%"
                - "Response time > 1000ms p95"
                - "Memory usage > 90%"
                - "Failed health checks"

# Infrastructure as Code
Infrastructure_code:

  aws_cdk:
    location: "infrastructure/cdk/"
    language: "TypeScript"
    version: "2.0+"
    
    stacks:
      NetworkStack:
        description: "VPC, subnets, security groups, and networking"
        resources:
          - "VPC with public and private subnets"
          - "Internet Gateway and NAT Gateways"
          - "Security Groups with least privilege"
          - "VPC Flow Logs for monitoring"
          
      DatabaseStack:
        description: "RDS PostgreSQL, ElastiCache Redis, and InfluxDB"
        resources:
          - "RDS PostgreSQL with Multi-AZ"
          - "ElastiCache Redis Cluster"
          - "InfluxDB on EKS"
          - "Database parameter groups"
          - "Subnet groups and security groups"
          
      ComputeStack:
        description: "ECS cluster, services, and auto-scaling"
        resources:
          - "ECS Fargate cluster"
          - "ECS services and task definitions"
          - "Application Auto Scaling"
          - "Service discovery"
          
      LoadBalancerStack:
        description: "Application Load Balancer and SSL termination"
        resources:
          - "Application Load Balancer"
          - "Target groups and health checks"
          - "SSL certificates and listeners"
          - "WAF for security"
          
      MonitoringStack:
        description: "CloudWatch, Prometheus, and Grafana"
        resources:
          - "CloudWatch dashboards and alarms"
          - "Prometheus on EKS"
          - "Grafana for visualization"
          - "Log groups and retention policies"
          
      SecurityStack:
        description: "IAM roles, secrets, and security services"
        resources:
          - "IAM roles and policies"
          - "Secrets Manager for credentials"
          - "GuardDuty for threat detection"
          - "Config for compliance"
          
  deployment_commands:
    bootstrap: "cdk bootstrap aws://ACCOUNT/REGION"
    diff: "cdk diff --all"
    deploy_staging: "cdk deploy --all --context env=staging"
    deploy_production: "cdk deploy --all --context env=production"
    destroy: "cdk destroy --all --force"
    
  terraform_components:
    location: "terraform/"
    modules:
      - "networking"
      - "security"
      - "monitoring"
      - "dns"
      
# Environment Management
environment_management:

  environment_promotion:
    development_to_staging:
      trigger: "merge to main branch"
      automated: true
      validation: "integration tests pass"
      rollback: "automatic on failure"
      
    staging_to_production:
      trigger: "manual approval after staging validation"
      automated: false
      validation: "comprehensive testing and approval"
      deployment_window: "Tuesday-Thursday, 9 AM - 5 PM EST"
      
  configuration_management:
    method: "AWS Systems Manager Parameter Store + Secrets Manager"
    encryption: "AWS KMS with customer-managed keys"
    versioning: true
    access_control: "IAM-based with least privilege"
    
    parameter_hierarchy:
      - "/sega/{env}/database/*"
      - "/sega/{env}/redis/*"
      - "/sega/{env}/api/*"
      - "/sega/{env}/monitoring/*"
      - "/sega/{env}/integrations/*"
      
  secrets_management:
    provider: "AWS Secrets Manager"
    rotation: "automatic for database credentials (30 days)"
    access_logging: "CloudTrail for all secret access"
    encryption: "AES-256 with customer-managed KMS keys"
    
    secret_categories:
      database_credentials:
        rotation_period: "30 days"
        automatic_rotation: true
        
      api_tokens:
        rotation_period: "90 days"
        manual_rotation: true
        
      encryption_keys:
        rotation_period: "365 days"
        manual_rotation: true

# Monitoring and Observability
monitoring:

  application_metrics:
    prometheus:
      enabled: true
      retention: "15 days"
      custom_metrics:
        - "sega_deployments_total"
        - "sega_deployment_duration_seconds"
        - "sega_security_scans_total"
        - "sega_vulnerabilities_discovered"
        - "sega_api_requests_total"
        - "sega_api_request_duration_seconds"
        
    cloudwatch:
      enabled: true
      custom_metrics:
        - "DeploymentSuccessRate"
        - "SecurityScanLatency"
        - "APIResponseTime"
        - "UserEngagement"
        - "ResourceUtilization"
        
  logging:
    centralized: true
    aggregation: "CloudWatch Logs + ELK Stack"
    retention: "30 days (standard), 365 days (audit)"
    structured_logging: true
    
    log_groups:
      - "/aws/ecs/sega-api"
      - "/aws/ecs/sega-worker"
      - "/aws/ecs/sega-frontend"
      - "/aws/rds/sega-postgresql"
      - "/aws/elasticache/sega-redis"
      
  tracing:
    aws_xray: true
    jaeger: true
    sampling_rate: 0.1
    trace_retention: "30 days"
    
  alerting:
    channels:
      - "Slack #sega-alerts"
      - "PagerDuty for critical alerts"
      - "Email for non-critical alerts"
      
    alert_rules:
      critical:
        - name: "Service Down"
          condition: "Health check failures > 3"
          notification: "immediate"
          
        - name: "High Error Rate"
          condition: "Error rate > 5% for 5 minutes"
          notification: "immediate"
          
        - name: "Database Connection Issues"
          condition: "Database connections > 80% for 5 minutes"
          notification: "immediate"
          
      warning:
        - name: "High Response Time"
          condition: "Response time > 500ms p95 for 5 minutes"
          notification: "5 minutes"
          
        - name: "High CPU Usage"
          condition: "CPU usage > 80% for 5 minutes"
          notification: "10 minutes"

# Security Configuration
security:

  network_security:
    vpc_design:
      - "Private subnets for Application services"
      - "Public subnets only for load balancers"
      - "Database subnets with no internet access"
      - "VPC endpoints for AWS services"
      
    security_groups:
      api_service:
        ingress:
          - port: 8000
            source: "load-balancer-sg"
            protocol: "tcp"
            
      database:
        ingress:
          - port: 5432
            source: "api-service-sg"
            protocol: "tcp"
            
      redis:
        ingress:
          - port: 6379
            source: "api-service-sg"
            protocol: "tcp"
            
    network_acls:
      - "Restrictive NACLs for additional security"
      - "Allow only necessary traffic"
      - "Log all denied traffic"
      
  container_security:
    image_scanning:
      - "Trivy scanning on image push"
      - "Critical and high vulnerability blocking"
      - "Regular rescanning of deployed images"
      
    runtime_security:
      - "AWS GuardDuty for runtime threat detection"
      - "Falco for container runtime monitoring"
      - "Read-only root filesystem"
      - "Non-root user execution"
      
    secrets_injection:
      - "AWS Secrets Manager integration"
      - "No secrets in environment variables"
      - "Secrets mounted as files"
      
  compliance:
    frameworks:
      - "SOC 2 Type II"
      - "GDPR compliance"
      - "HIPAA considerations"
      
    auditing:
      - "AWS CloudTrail for API calls"
      - "Application audit logs"
      - "Database audit logs"
      - "Container access logs"
      
    encryption:
      at_rest:
        - "EBS volume encryption"
        - "RDS encryption"
        - "S3 bucket encryption"

      in_transit:
        - "TLS 1.2 for all communications"
        - "Certificate management with ACM"
        - "Internal service mesh encryption"

# Disaster Recovery
disaster_recovery:

  backup_strategy:
    database:
      automated_backups: true
      backup_window: "03:00-04:00 UTC"
      retention: "30 days"
      cross_region_backup: true
      point_in_time_recovery: "35 days"
      
    application_data:
      s3_versioning: true
      cross_region_replication: true
      lifecycle_policies: "intelligent tiering"
      
    infrastructure:
      terraform_state: "S3 backend with versioning"
      configuration_backup: "Git repository with encryption"
      
  recovery_procedures:
