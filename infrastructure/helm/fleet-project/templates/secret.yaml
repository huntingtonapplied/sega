{{/*
Production path: sega secrets push creates the Secret out-of-band (T4) and this
template is skipped. create:true is for standalone local testing ONLY — never
commit real credentials, and postgresqlUrl must not be a CHANGE_ME placeholder.
*/}}
{{- if .Values.secret.create }}
{{- if or (not .Values.secret.data.postgresqlUrl) (contains "CHANGE_ME" .Values.secret.data.postgresqlUrl) }}
{{- fail "secret.create=true requires a real secret.data.postgresqlUrl (no CHANGE_ME). Prefer `sega secrets push` and secret.create=false." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleet-project.secretName" . }}
  namespace: {{ include "fleet-project.namespace" . }}
  labels:
    {{- include "fleet-project.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgresql_url: {{ .Values.secret.data.postgresqlUrl | quote }}
  redis_password: {{ .Values.secret.data.redisPassword | quote }}
{{- end }}
