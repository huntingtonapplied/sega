{{- if .Values.ingress.enabled }}
{{- $root := . -}}
{{- $name := include "fleet-project.name" . -}}
{{- $ns := include "fleet-project.namespace" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "fleet-project.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range $svc, $cfg := .Values.web }}
    {{- if $cfg.host }}
    - host: {{ $cfg.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-{{ $svc }}
                port:
                  number: {{ $cfg.port }}
    {{- end }}
    {{- end }}
{{- end }}
