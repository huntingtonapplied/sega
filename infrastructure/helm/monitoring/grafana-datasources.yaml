# ===============================================================
# SEGA CONFIG - Grafana Datasources Configuration
# ===============================================================
# File: docs/monitoring/grafana-datasources.yaml
# Purpose: Grafana datasource configuration for SEGA platform monitoring
#
# Description: Defines Grafana datasource connections to Prometheus and Loki
# for metrics visualization and log aggregation. Configures proxy access
# to monitoring backend services.
#
# Used by: Grafana monitoring dashboard, monitoring stack deployment
# Format: YAML

apiVersion: 1
datasources:
- name: Prometheus
  type: prometheus
  access: proxy
  url: http://prometheus:9090
- name: Loki
  type: loki
  access: proxy
  url: http://loki:3100