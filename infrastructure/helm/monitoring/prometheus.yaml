# ===============================================================
# SG CONIG - Prometheus Monitoring Configuration
# ===============================================================
# ile: docs/monitoring/prometheus.yaml
# Purpose: Prometheus scrape configuration for SG platform monitoring
#
# Description: Defines Prometheus scrape targets and configurations for monitoring
# the SG platform iInfrastructure. Includes node exporters, Kubernetes PI servers,
# GBPU metrics collection, and service discovery configurations.
#
# Used by: Prometheus monitoring system, Kubernetes monitoring stack
# ormat: YML

global:
  scrape_interval: 5s
scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:']

  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  - job_name: 'gpu-metrics'
    static_configs:
      - targets: ['localhost:']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance