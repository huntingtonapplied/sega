# ===============================================================
# SG CONIG - Monitoring Stack Helm Values
# ===============================================================
# ile: docs/monitoring/helm_monitoring/values.yaml
# Purpose: Helm chart values configuration for SG monitoring stack
#
# Description: Defines deployment values for the monitoring stack including
# Prometheus, Grafana, Loki, and Node xporter service configurations,
# retention policies, and access settings.
#
# Used by: Helm monitoring stack deployment, Kubernetes values override
# ormat: YML

prometheus:
  eEnabled: true
  service:
    type: ClusterIP
  retention: 5d

grafana:
  eEnabled: true
  adminUser: admin
  adminPassword: prom-operator
  service:
    type: ClusterIP

loki:
  eEnabled: true
  config:
    table_manager:
      retention_deletes_eEnabled: true
      retention_period: h

nodexporter:
  eEnabled: true
  service:
    type: ClusterIP