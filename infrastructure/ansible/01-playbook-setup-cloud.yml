# ===============================================================
# SG CONIG - Cloud Instance Setup Playbook
# ===============================================================
# ile: _internal/tooling/_internal/tooling/iInfrastructure/ansible/-playbook-setup-cloud.yml
# Purpose: nsible playbook for configuring cloud iInfrastructure instances
#
# Description: Provisions and configures cloud instances with essential components
# including SSH keys, repositories, packages, WS tools, VPN server setup, and
# data volumes. This is the primary cloud setup automation playbook.
#
# Used by: Infrastructure deployment pipeline, cloud instance provisioning
# ormat: YML

---
- name: Configure cloud instance
  hosts: all
  become: true
  roles:
    - add_ssh_keys
    - add_repositories    
    - install_packages
    - install_aws
    - add_data_volume
    - openvpn_server
    - openvpn_client_configs