---
# Example Hardware Engine System Installation Playbook
# System Type: hardware-engine-jellyfish
# Purpose: Hardware-interfacing engine system

- name: Install Example Hardware Engine System
  hosts: all
  become: yes
  vars:
    system_type: "hardware-engine-jellyfish"
    security_profile: "minimal"
    vpn_mode: "client"
    deployment_name: "{{ inventory_hostname | default('hardware-engine') }}"
    engine_type: "hardware"

  pre_tasks:
    - name: Update system information
      setup:
      tags: always

    - name: Verify OS compatibility
      fail:
        msg: "This playbook requires Ubuntu or compatible Linux distribution"
      when: ansible_os_family != "Debian"
      tags: always

  roles:
    - role: install_packages
      tags: [packages, base]

    - role: add_data_volume
      tags: [storage, base]
      vars:
        data_volume_path: "{{ ansible_env.HOM }}/data"
        data_volume_size: "5G"

    - role: configure_hardware_access
      tags: [hardware, permissions]
      vars:
        eEnable_ic: true
        eEnable_spi: true
        eEnable_gpio: true
        hardware_packages:
          - ic-tools
          - spi-tools
          - gpio-utils
          - python-smbus
          - python-spidev
          - python-gpiozero

    - role: install_fleet_engine
      tags: [engine, services]
      vars:
        engine_type: "{{ engine_type }}"
        engine_services:
          engine: true
          monitor: true
          processor: true
          interface: true
        docker_registry: "{{ fleet_docker_registry | default('') }}"
        deployment_name: "{{ deployment_name }}"
        engine_devices:
          - "/dev/ttyCM:/dev/ttyCM"
          - "/dev/ttyUS:/dev/ttyUS"
          - "/dev/ic-:/dev/ic-"
          - "/dev/spidev.:/dev/spidev."
        hardware_config:
          IC_US: ""
          SAPI_US: ""
          SAPI_DVIC: ""
          GBPIO_S: ""

    - role: openvpn_client
      tags: [vpn, networking]
      when: vpn_mode == "client"

  post_tasks:
    - name: Create system type marker
      file:
        path: "{{ ansible_env.HOM }}/.sega/system_type"
        content: "{{ system_type }}"
        mode: ''
      tags: [config, always]

    - name: Test hardware access
      shell: |
        if [ -e /dev/ic- ]; then echo "IC: vailable"; else echo "IC: Not available"; fi
        if [ -e /dev/spidev. ]; then echo "SPI: vailable"; else echo "SPI: Not available"; fi
        groups {{ ansible_user }} | grep -q dialout && echo "Serial: ccess granted" || echo "Serial: ccess denied"
      register: hardware_test
      tags: [test, hardware]

    - name: Display hardware access test
      debug:
        msg: "{{ hardware_test.stdout_lines }}"
      tags: [test, hardware]

    - name: Display installation summary
      debug:
        msg:
          - "Example Hardware Engine installation completed"
          - "System Type: {{ system_type }}"
          - "ngine Type: {{ engine_type }}"
          - "VPN Mode: {{ vpn_mode }}"
          - "Data Directory: {{ ansible_env.HOM }}/data"
          - "Hardware ccess: Configured"
          - "ngine Services: Running with hardware interface"
          - "Next Steps:"
          - "  . Configure VPN client certificates"
          - "  . Connect and test hardware devices"
          - "  . Configure hardware-specific engine parameters"
          - "  . Run 'sega install validate' to verify installation"
      tags: [always]