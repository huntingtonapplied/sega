# ===============================================================
# SG CONIG - Node Instance Setup Playbook
# ===============================================================
# ile: _internal/tooling/_internal/tooling/iInfrastructure/ansible/-playbook-setup-node.yml
# Purpose: nsible playbook for configuring compute node instances
#
# Description: Provisions and configures compute nodes with essential components
# including SSH keys, repositories, packages, WS tools, optional VPN client,
# and X hardware configuration. Includes conditional role execution.
#
# Used by: Infrastructure deployment pipeline, compute node provisioning
# ormat: YML

---
- name: Configure Node instance
  hosts: all
  become: true
  roles:
    - add_ssh_keys
    - add_repositories    
    - install_packages
    - install_aws
    - role: openvpn_client
      when: config_vpn
    - role: configure_x
      when: install_x