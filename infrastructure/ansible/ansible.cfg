[defaults]
localhost_warning = false
# callbacks_enabled = ansible.posix.debug  # Disabled for production - enable for debugging
# stdout_callback = ansible.posix.debug    # Disabled for production - enable for debugging
host_key_checking = false
ssh_pipelining = true
ssh_retries = 
cache_plugin = jsonfile
cache_plugin_timeout = 
cache_plugin_connection = $venv/factcache
gathering = smart
allow_world_readable_tmpfiles=true

[inventory]
inventory_unparsed_warning = false