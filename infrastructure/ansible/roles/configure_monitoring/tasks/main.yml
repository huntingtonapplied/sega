---
# Monitoring Configuration Role
# Configures Prometheus, Grafana, and metrics-service integration
# Referenced by: server system type
# Integrates with: the metrics service (port 3308 TCP protobuf)

- name: Ensure monitoring directories exist
  become: true
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/example/monitoring
    - /opt/example/monitoring/prometheus
    - /opt/example/monitoring/grafana
    - /opt/example/monitoring/alertmanager
    - /var/log/example/monitoring

# Prometheus Installation
- name: Install Prometheus
  become: true
  apt:
    name: prometheus
    state: present
    update_cache: yes
  when: ansible_os_family == 'Debian'

- name: Configure Prometheus for the fleet
  become: true
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: '0644'
  notify: restart prometheus

- name: Configure Prometheus scrape targets for fleet projects
  become: true
  copy:
    dest: /etc/prometheus/example_targets.yml
    content: |
      # Project Metrics Targets
      # Auto-generated by SEGA install
      - targets:
        {% for project in monitored_projects | default(['metrics', 'atlas', 'hermes']) %}
          - localhost:{{ 9000 + (project_ids[project] | default(0)) }}
        {% endfor %}
        labels:
          env: {{ monitoring_environment | default('production') }}
          ecosystem: example
    mode: '0644'
  notify: restart prometheus

# Grafana Installation
- name: Install Grafana
  become: true
  apt:
    name: grafana
    state: present
  when: ansible_os_family == 'Debian'

- name: Configure Grafana datasource for Prometheus
  become: true
  copy:
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://localhost:9090
          isDefault: true
          editable: false
    mode: '0644'
  notify: restart grafana

# Metrics Service Integration
- name: Configure metrics service TCP endpoint
  become: true
  copy:
    dest: /opt/example/monitoring/metrics_config.yml
    content: |
      # Metrics Collection Configuration
      metrics:
        tcp_host: {{ metrics_host | default('localhost') }}
        tcp_port: {{ metrics_port | default(3308) }}
        protocol: protobuf
        enabled: {{ metrics_enabled | default(true) }}
    mode: '0644'

# Node Exporter for system metrics
- name: Install Node Exporter
  become: true
  apt:
    name: prometheus-node-exporter
    state: present
  when: ansible_os_family == 'Debian'

- name: Enable and start Node Exporter
  become: true
  systemd:
    name: prometheus-node-exporter
    state: started
    enabled: yes

# Enable monitoring services
- name: Enable and start Prometheus
  become: true
  systemd:
    name: prometheus
    state: started
    enabled: yes

- name: Enable and start Grafana
  become: true
  systemd:
    name: grafana-server
    state: started
    enabled: yes
