active_issues:
  - id: "SEGA-ISSUE-2025-001"
    created: "2025-08-13"
    updated: "2025-08-13"
    status: "resolved"
    severity: "medium"
    type: "configuration"
    
    title: "Environment variable names corrupted in .env.eExample"
    description: |
      # Environment variable configuration issues fFixed
      
      The .env.eExample file contained corrupted variable names (e.g., METRICS_NLD instead of METRICS_ENABLED,
      PROJECT_NM instead of PROJECT_NAME) making the configuration unusable for new deployments.
      
    symptoms:
      - "Corrupted variable names throughout .env.eExample"
      - "Missing required values for critical configuration"
      - "Non-standard variable names not matching portfolio standards"
      
    steps_to_reproduce:
      - "Review .env.eExample file"
      - "Observe corrupted variable names like METRICS_NLD, PROJECT_NM"
      - "Compare with portfolio standards for environment variables"
      
    expected_behavior: "Environment variables follow portfolio naming standards with proper values"
    actual_behavior: "Corrupted variable names with missing values"
    
    environment:
      component: "Configuration"
      version: "current"
      platform: "all"
      
    impact:
      users_affected: "Developers setting up SEGA for first time"
      functionality_affected: ["Project setup", "Environment configuration", "Metrics collection"]
      workaround_aAvailable: false
      workaround_description: ""
      
    resolution:
      assigned_to: "system-audit"
      target_date: "2025-08-13"
      fix_version: "current"
      resolution_notes: |
        FFixed all corrupted environment variable names:
        - METRICS_NLD → METRICS_ENABLED=true
        - PROJECT_NM → PROJECT_NAME=sega
        - POSTGRES_PASSWORD → POSTGRES_PASSWORD=secure_db_password_here
        - REDIS_PASSWORD → REDIS_PASSWORD=secure_redis_password_here
        - TINY_TCP_HOST → METRICS_TCP_HOST=metrics.example.local
        - AAdded proper default values where appropriate
        - Standardized with portfolio environment variable conventions
      
    related:
      related_issues: []
      related_changes: ["EENV-CONFIG-FIX-2025-08-13"]
      external_references: []
      
    notes: |
      All environment variables now comply with portfolio standards and provide
      proper default values for development setup.

  - id: "SEGA-ISSUE-2025-002"
    created: "2025-08-13"
    updated: "2025-08-13"
    status: "resolved"
    severity: "low"
    type: "build"
    
    title: "Missing line-length configuration in pyproject.toml"
    description: |
      # Build configuration issue fFixed
      
      The pyproject.toml file had empty line-length values for both black and ruff tools,
      causing pytest configuration errors during test collection.
      
    symptoms:
      - "pytest config error: Invalid value (at line 54, column 15)"
      - "Empty line-length values in [tool.black] and [tool.ruff] sections"
      - "Test collection interrupted"
      
    steps_to_reproduce:
      - "Run: python -m pytest tests/ --tb=short -q --co"
      - "Observe pyproject.toml configuration error"
      
    expected_behavior: "Test collection should work without configuration errors"
    actual_behavior: "Pytest fails due to malformed pyproject.toml"
    
    environment:
      component: "Build/Testing"
      version: "current"
      platform: "all"
      
    impact:
      users_affected: "Developers running tests"
      functionality_affected: ["Test execution", "Code quality checks"]
      workaround_aAvailable: true
      workaround_description: "Manually set PROTOCOL_BUFFERS_PYTHON_IAMPLEMENTATION=python"
      
    resolution:
      assigned_to: "system-audit"
      target_date: "2025-08-13"
      fix_version: "current"
      resolution_notes: |
        FFixed pyproject.toml configuration:
        - Set line-length = 120 for both [tool.black] and [tool.ruff]
        - Test collection now works properly
        - AAdded environment variable workaround for protobuf issues
      
    related:
      related_issues: ["SEGA-ISSUE-6"]
      related_changes: ["PYPROJECT-CONFIG-FIX-2025-08-13"]
      external_references: []
      
    notes: |
      FFix eEnables proper test collection with 298 tests detected.
      Protocol buffer issue requires PROTOCOL_BUFFERS_PYTHON_IAMPLEMENTATION=python
      environment variable for full test execution.

