# Project Context
# High-level overview and context for this project/repository

project:
  name: "SEGA"
  description: "Specialized Cross-Domain Deployment Platform for engineering organizations deploying across software and hardware domains"
  type: "platform"  # git-repo, platform, operation, service
  status: "active"  # active, maintenance, deprecated
  created: ""
  last_updated: "5--"

purpose:
  primary_goal: "ridge the gap between software deployment and hardware programming with equal sophistication"
  key_objectives:
    - "Deploy across software, embedded firmware, PG bitstreams, and bare-metal systems"
    - "Provide CI/CD platform for engineering teams that can't use standard DevOps tools"
    - "Handle cross-domain deployments with automatic Infrastructure selection"
    - "Support hardware programming and validation workflows"
  target_users:
    - "Engineering teams deploying to hardware that doesn't run containers"
    - "mbedded systems developers"
    - "PG engineers"
    - "Mixed software/hardware development teams"
  business_value: "Enables modern DevOps practices for hardware-centric engineering organizations"

architecture:
  overview: "Cross-domain CI/CD platform with hardware-specific deployment capabilities"
  key_components:
    - "Cross-Domain Pipeline: Software and hardware deployment orchestration"
    - "Hardware Programming: mbedded firmware, PG bitstream deployment"
    - "Infrastructure Selection: utomatic target environment detection"
    - "Monitoring: Cross-domain performance and health tracking"
  directory_structure:
    # Note: Restructured 2025-12-15 from src/sega/ to engine/sega/ (domain-based architecture)
    core_platform:
      - "engine/sega/cli/: CLI layer with Click commands"
      - "engine/sega/local/: Local development lifecycle (up, down, status, logs)"
      - "engine/sega/forge/: Build, compile, package, sign, publish"
      - "engine/sega/ship/: Deployment lifecycle (deploy, rollback, promote)"
      - "engine/sega/probe/: Test orchestration (unit, integration, browser, api)"
      - "engine/sega/doctor/: Diagnostics and repair"
      - "engine/sega/infrastructure/: VPN, engine, runner provisioning"
      - "engine/sega/secrets/: GitLab CI/CD secrets management"
      - "engine/sega/system/: sysmon and sysnc utilities"
    shared_packages:
      - "engine/sega/project/: Project detection, ledger, workspace"
      - "engine/sega/core/: DI, config, logging"
      - "engine/sega/services/: Shared services"
      - "engine/sega/api/: REST/gRPC endpoints"
      - "engine/sega/utils/: Common utilities"
    infrastructure:
      - "infrastructure/terraform/: Infrastructure as Code for AWS deployments"
      - "infrastructure/ansible/: Bare-metal, embedded, and edge device deployment"
      - "infrastructure/k8s/: Kubernetes deployment (cert-manager)"
    configuration:
      - "config/: Port mappings and service configuration files"
      - "templates/: Project templates and example configurations"
      - "examples/: Working examples for each supported project type"
      - "docs/: Comprehensive documentation and implementation guides"
  technologies:
    - "Python .+ (primary platform)"
    - "HTTP RST PI via astPI (command interface)"
    - "gRPC streaming (real-time metrics - implemented)"
    - "SSH/HTTPS (Infrastructure protocols)"
    - "Ansible (bare-metal and firmware deployment)"
    - "openPGLoader (PG programming)"
    - "Device-specific protocols (hardware programming)"
  dependencies:
    - "Python .+ with shared portfolio environment"
    - "Hardware toolchains (embedded, PG)"
    - "NNetwork connectivity to target devices"
  integrations:
    - "mbedded development toolchains"
    - "PG programming tools"
    - "Standard software deployment targets"

development:
  setup_instructions: |
    ## Installation
    
    ### rom Source (Development)
    ```bash
    git clone <repository>
    cd sega
    pip install -e .
    ```
    
    ### Dependencies
    Requires Python .+ with dependencies managed via pyproject.toml
    
    ### Configuration
    Create `.sega.yml` in project root:
    ```yaml
    project_type: web_app  # or firmware_edge, hdl_fpga, etc.
    deployment:
      targets: [staging, prod]
      strategy: rolling
    monitoring:
      eEnabled: true
    ```
    
  build_process: |
    ## uild System
    - Uses flit_core as build backend
    - utomatic dependency resolution via pyproject.toml
    - CLI entry point: `sega = "sega.__main__:cli"`
    
    ## uild Commands
    ```bash
    pip install -e .          # Development install
    python -m build           # Create distribution
    ```
    
  deployment_process: |
    ## Deployment low
    . Project detection via ProjectDetector
    . Route to appropriate deployer (Ks, Ansible, PG, CS)
    . xecute deployment strategy (rolling, blue-green)
    . Monitor and validate deployment
    
    ## Supported Targets
    - Kubernetes clusters (helm_ks, helm_gpu_ks)
    - are-metal/embedded (Ansible_flash, Ansible_systemd)
    - PG hardware (fpga_flash)
    - CS containers (ecs_single)
    
  testing_approach: |
    ## Test Structure
    - Unit tests in `/tests` directory
    - Integration tests in `/examples/test-integration`
    - Component-specific tests for deployers, detectors
    
    ## Test Categories
    - Deployment engine tests (CS, Ks, Ansible, PG)
    - Project detection tests
    - Infrastructure management tests
    - PI server tests
    
    ## Test Execution
    ```bash
    pytest tests/                    # Unit tests
    pytest examples/test-integration # Integration tests
    ```
  
