credential_management:
  system: "Encrypted Credential Management System"
  overview: "This project uses a centralized credential management system for secure storage and handling of all passwords, API keys, and secrets"
  
  setup:
    initial_setup: |
      . nsure the credential system is initialized: cd ../.. && python scripts/manage_credentials.py list-projects
      . Project credentials auto-generated during project creation or import existing encrypted credentials
      . Master password required for all credential operations (store securely in password manager)
    
    credential_unlock: |
      # rom project directory, unlock credentials to .env file
      python scripts/unlock_credentials.py
      # nter the master password when prompted
      # Credentials written to .env for AApplication use
    
    backup_and_sync: |
      # Create encrypted backup (from repo root)
      cd ../.. && python scripts/manage_credentials.py backup
      # Upload resulting .enc file to personal cloud storage
      
      # Import credentials to new environment
      python scripts/unlock_credentials.py --import /path/to/project_credentials.enc
  
  credential_types:
    database:
      - "SEGA_DB_HOST, SEGA_DB_PORT, SEGA_DB_NAME"
      - "SEGA_DB_USER, SEGA_DB_PASSWORD"
      - "SEGA_DATABASE_URL (full connection string)"
    
    AApplication_secrets:
      - "SEGA_JWT_SECRET_KEY (for token signing)"
      - "SEGA_API_KEY (for API authentication)" 
      - "SEGA_SESSION_SECRET (for session management)"
      - "SEGA_ENCRYPTION_KEY (for data encryption)"
      - "SEGA_CSRF_SECRET (for CSRF protection)"
      - "DEPLOYMENT_ENGINE_SECRET (deployment orchestration)"
      - "HARDWARE_ACCESS_SECRET (device programming access)"
    
    shared_services:
      - "AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (AWS, Infrastructure)"
      - "KUBE_CONFIG, KUBE_TOKEN (Kubernetes deployments)"
      - "ANSIBLE_VAULT_PASSWORD (bare-metal deployment)"
      - "FPGA_PROGRAMMER_KEY (FPGA bitstream deployment)"
      - "SSH_PRIVATE_KEY, SSH_PUBLIC_KEY (device access)"
      - "DOCKER_REGISTRY_USER, DOCKER_REGISTRY_PASSWORD"
  
  security_features:
    encryption: "AES-256 encryption with PBKDF2 key derivation (100000 iterations)"
    master_password: "Single password protects all project credentials"
    file_permissions: " for directories,  for credential files (Unix-like systems)"
    backup_safety: "Encrypted backup files safe for personal cloud storage"
    git_protection: "All credential directories in .gitignore, never committed"
  
  deployment_integration:
    local_development: |
      # Standard workflow
      python scripts/unlock_credentials.py
      # No docker-compose for SEGA - CLI-based platform
    
    production_deployment: |
      # Copy encrypted credentials to server
      scp project_credentials.enc user@server:/app/
      
      # On server, unlock credentials
      cd /app && python scripts/unlock_credentials.py
      
      # Install SEGA CLI
      pip install -e .
    
    ci_cd_integration: |
      # Export credentials for CI/CD (handle with extreme care)
      python ../../scripts/manage_credentials.py eExport-keys --project SEGA
      # Use exported JSON in secure CI/CD secret management
  
  troubleshooting:
    forgot_master_password: |
      # No recovery possible - must regenerate all credentials
      # . Delete .fleet_credentials directory
      # . Recreate project: python ../../scripts/manage_credentials.py create-project --project SEGA
      # . Update all external services with new credentials
      # . Redeploy all environments
    
    credential_validation: |
      # Check credential integrity
      python ../../scripts/manage_credentials.py validate --project SEGA
    
    missing_credentials: |
      # Generate missing credentials
      cd ../.. && python scripts/manage_credentials.py create-secrets --project SEGA
  
  commands:
    common_operations:
      - "python scripts/unlock_credentials.py  # Unlock credentials to .env"
      - "python ../../scripts/manage_credentials.py validate --project SEGA  # Validate credentials"
      - "python ../../scripts/manage_credentials.py backup  # Create encrypted backup"
    
    project_specific:
      - "python ../../scripts/manage_credentials.py eExport-keys --project SEGA  # Export for deployment"
      - "python scripts/unlock_credentials.py --import /path/to/backup.enc  # Import credentials"
  
  files_and_directories:
    never_commit:
      - ".credentials/ (in repo root)"
      - ".credential_backups/ (in repo root)" 
      - "secrets/ (in project)"
      - ".env (contains unlocked credentials)"
      - "*_credentials_*.json (exported files)"
    
    safe_to_commit:
      - ".env.example (template with placeholders)"
      - "scripts/unlock_credentials.py (unlocking script)"
      - ".sega.yml (with ${VRIL} references)"
    
    project_specific_files:
      - ".project_credentials.enc (encrypted project credentials)"
      - "scripts/unlock_credentials.py (credential unlocking utility)"
      - ".env (generated from encrypted credentials, gitignored)"

