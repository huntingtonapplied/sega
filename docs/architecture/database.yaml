# ================================
# PROJECT DATABASE SCHEMA AND DESIGN
# Project: SEGA - the fleet CLI for a whole portfolio of services
# File: docs/database.yaml
# Purpose: Database schema, design, and data management
# ================================

project:
  name: "SEGA"
  description: "The fleet CLI: one command grammar for your whole portfolio of services"
  database_approach: "Multi-database architecture with PostgreSQL as primary store, Redis for caching, and InfluxDB for time-series data"

# Database Architecture Overview
database_architecture:

  primary_database:
    type: "PostgreSQL"
    version: "15.4+"
    purpose: "Transactional data, project metadata, user management"
    hosting: "Amazon RDS with Multi-AZ deployment"
    
  cache_store:
    type: "Redis"
    version: "7.0+"
    purpose: "Session storage, API caching, temporary data"
    hosting: "Amazon ElastiCache with cluster mode"
    
  time_series_database:
    type: "InfluxDB"
    version: "2.7+"
    purpose: "Metrics, monitoring data, performance tracking"
    hosting: "Self-managed on Kubernetes"
    
  search_engine:
    type: "Elasticsearch"
    version: "8.10+"
    purpose: "Full-text search, log analysis, audit trails"
    hosting: "Amazon OpenSearch Service"

# PostgreSQL Schema Design
postgresql_schema:

  # Core Tables
  core_tables:
    
    users:
      description: "User accounts and Authentication"
      columns:
        id:
          type: "UUID"
          primary_key: true
          default: "gen_random_uuid()"
        username:
          type: "VARCHAR(50)"
          unique: true
          not_null: true
        email:
          type: "VARCHAR(255)"
          unique: true
          not_null: true
        password_hash:
          type: "VARCHAR(255)"
          not_null: true
        first_name:
          type: "VARCHAR(100)"
        last_name:
          type: "VARCHAR(100)"
        is_active:
          type: "BOOLEAN"
          default: true
        is_superuser:
          type: "BOOLEAN"
          default: false
        created_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
        updated_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
        last_login:
          type: "TIMESTAMP WITH TIME ZONE"
      indexes:
        - "CREATE INDEX idx_users_email ON users(email)"
        - "CREATE INDEX idx_users_username ON users(username)"
        - "CREATE INDEX idx_users_active ON users(is_active)"
        
    teams:
      description: "Team organization and membership"
      columns:
        id:
          type: "UUID"
          primary_key: true
          default: "gen_random_uuid()"
        name:
          type: "VARCHAR(100)"
          unique: true
          not_null: true
        slug:
          type: "VARCHAR(100)"
          unique: true
          not_null: true
        description:
          type: "TEXT"
        settings:
          type: "JSONB"
          default: "'{}'"
        created_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
        updated_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
      indexes:
        - "CREATE INDEX idx_teams_slug ON teams(slug)"
        - "CREATE INDEX idx_teams_settings ON teams USING GIN(settings)"
        
    team_memberships:
      description: "User team memberships and roles"
      columns:
        id:
          type: "UUID"
          primary_key: true
          default: "gen_random_uuid()"
        user_id:
          type: "UUID"
          foreign_key: "users(id)"
          not_null: true
        team_id:
          type: "UUID"
          foreign_key: "teams(id)"
          not_null: true
        role:
          type: "team_role_enum"
          not_null: true
        joined_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
      constraints:
        - "UNIQUE(user_id, team_id)"
      indexes:
        - "CREATE INDEX idx_team_memberships_user ON team_memberships(user_id)"
        - "CREATE INDEX idx_team_memberships_team ON team_memberships(team_id)"
        
    projects:
      description: "Project metadata and configuration"
      columns:
        id:
          type: "UUID"
          primary_key: true
          default: "gen_random_uuid()"
        name:
          type: "VARCHAR(255)"
          not_null: true
        slug:
          type: "VARCHAR(255)"
          not_null: true
        description:
          type: "TEXT"
        project_type:
          type: "project_type_enum"
          not_null: true
        team_id:
          type: "UUID"
          foreign_key: "teams(id)"
          not_null: true
        repository_url:
          type: "VARCHAR(500)"
        repository_provider:
          type: "git_provider_enum"
        default_branch:
          type: "VARCHAR(100)"
          default: "'main'"
        status:
          type: "project_status_enum"
          default: "'active'"
        health_score:
          type: "INTEGER"
          check: "health_score >= 0 AND health_score <= 100"
        configuration:
          type: "JSONB"
          default: "'{}'"
        metadata:
          type: "JSONB"
          default: "'{}'"
        created_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
        updated_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
        last_scan_at:
          type: "TIMESTAMP WITH TIME ZONE"
        last_deployment_at:
          type: "TIMESTAMP WITH TIME ZONE"
      constraints:
        - "UNIQUE(team_id, slug)"
      indexes:
        - "CREATE INDEX idx_projects_team ON projects(team_id)"
        - "CREATE INDEX idx_projects_type ON projects(project_type)"
        - "CREATE INDEX idx_projects_status ON projects(status)"
        - "CREATE INDEX idx_projects_config ON projects USING GIN(configuration)"
        - "CREATE INDEX idx_projects_metadata ON projects USING GIN(metadata)"
        
    project_components:
      description: "Multi-component project structure"
      columns:
        id:
          type: "UUID"
          primary_key: true
          default: "gen_random_uuid()"
        project_id:
          type: "UUID"
          foreign_key: "projects(id)"
          not_null: true
        name:
          type: "VARCHAR(255)"
          not_null: true
        component_type:
          type: "project_type_enum"
          not_null: true
        path:
          type: "VARCHAR(500)"
        technology:
          type: "VARCHAR(100)"
        configuration:
          type: "JSONB"
          default: "'{}'"
        created_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
      constraints:
        - "UNIQUE(project_id, name)"
      indexes:
        - "CREATE INDEX idx_project_components_project ON project_components(project_id)"
        
  # Deployment Tables
  deployment_tables:
    
    deployments:
      description: "Deployment records and status"
      columns:
        id:
          type: "UUID"
          primary_key: true
          default: "gen_random_uuid()"
        project_id:
          type: "UUID"
          foreign_key: "projects(id)"
          not_null: true
        environment:
          type: "VARCHAR(50)"
          not_null: true
        status:
          type: "deployment_status_enum"
          not_null: true
        strategy:
          type: "deployment_strategy_enum"
          not_null: true
        version:
          type: "VARCHAR(100)"
        commit_sha:
          type: "VARCHAR(40)"
        triggered_by:
          type: "UUID"
          foreign_key: "users(id)"
        trigger_type:
          type: "trigger_type_enum"
          not_null: true
        configuration:
          type: "JSONB"
          default: "'{}'"
        started_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
        completed_at:
          type: "TIMESTAMP WITH TIME ZONE"
        duration_seconds:
          type: "INTEGER"
        error_message:
          type: "TEXT"
        logs_location:
          type: "VARCHAR(500)"
        metadata:
          type: "JSONB"
          default: "'{}'"
      indexes:
        - "CREATE INDEX idx_deployments_project ON deployments(project_id)"
        - "CREATE INDEX idx_deployments_status ON deployments(status)"
        - "CREATE INDEX idx_deployments_environment ON deployments(environment)"
        - "CREATE INDEX idx_deployments_started ON deployments(started_at)"
        - "CREATE INDEX idx_deployments_config ON deployments USING GIN(configuration)"
        
    deployment_steps:
      description: "Individual deployment step execution"
      columns:
        id:
          type: "UUID"
          primary_key: true
          default: "gen_random_uuid()"
        deployment_id:
          type: "UUID"
          foreign_key: "deployments(id)"
          not_null: true
        step_name:
          type: "VARCHAR(255)"
          not_null: true
        step_order:
          type: "INTEGER"
          not_null: true
        status:
          type: "step_status_enum"
          not_null: true
        started_at:
          type: "TIMESTAMP WITH TIME ZONE"
        completed_at:
          type: "TIMESTAMP WITH TIME ZONE"
        duration_seconds:
          type: "INTEGER"
        output:
          type: "TEXT"
        error_message:
          type: "TEXT"
      constraints:
        - "UNIQUE(deployment_id, step_order)"
      indexes:
        - "CREATE INDEX idx_deployment_steps_deployment ON deployment_steps(deployment_id)"
        - "CREATE INDEX idx_deployment_steps_status ON deployment_steps(status)"
        
  # Security Tables
  security_tables:
    
    security_scans:
      description: "Security scan execution records"
      columns:
        id:
          type: "UUID"
          primary_key: true
          default: "gen_random_uuid()"
        project_id:
          type: "UUID"
          foreign_key: "projects(id)"
          not_null: true
        scan_type:
          type: "scan_type_enum"
          not_null: true
        scanner_name:
          type: "VARCHAR(100)"
          not_null: true
        scanner_version:
          type: "VARCHAR(50)"
        status:
          type: "scan_status_enum"
          not_null: true
        commit_sha:
          type: "VARCHAR(40)"
        started_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
        completed_at:
          type: "TIMESTAMP WITH TIME ZONE"
        duration_seconds:
          type: "INTEGER"
        configuration:
          type: "JSONB"
          default: "'{}'"
        summary:
          type: "JSONB"
          default: "'{}'"
        report_location:
          type: "VARCHAR(500)"
      indexes:
        - "CREATE INDEX idx_security_scans_project ON security_scans(project_id)"
        - "CREATE INDEX idx_security_scans_type ON security_scans(scan_type)"
        - "CREATE INDEX idx_security_scans_status ON security_scans(status)"
        - "CREATE INDEX idx_security_scans_started ON security_scans(started_at)"
        
    vulnerabilities:
      description: "Discovered security vulnerabilities"
      columns:
        id:
          type: "UUID"
          primary_key: true
          default: "gen_random_uuid()"
        scan_id:
          type: "UUID"
          foreign_key: "security_scans(id)"
          not_null: true
        project_id:
          type: "UUID"
          foreign_key: "projects(id)"
          not_null: true
        vulnerability_id:
          type: "VARCHAR(255)"
          not_null: true
        cve_id:
          type: "VARCHAR(50)"
        title:
          type: "VARCHAR(500)"
          not_null: true
        description:
          type: "TEXT"
        severity:
          type: "severity_enum"
          not_null: true
        cvss_score:
          type: "DECIMAL(3,1)"
          check: "cvss_score >= 0.0 AND cvss_score <= 10.0"
        affected_component:
          type: "VARCHAR(255)"
        affected_version:
          type: "VARCHAR(100)"
        fixed_version:
          type: "VARCHAR(100)"
        file_path:
          type: "VARCHAR(1000)"
        line_number:
          type: "INTEGER"
        remediation:
          type: "TEXT"
        status:
          type: "vulnerability_status_enum"
          default: "'open'"
        assigned_to:
          type: "UUID"
          foreign_key: "users(id)"
        discovered_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
        resolved_at:
          type: "TIMESTAMP WITH TIME ZONE"
        metadata:
          type: "JSONB"
          default: "'{}'"
      indexes:
        - "CREATE INDEX idx_vulnerabilities_scan ON vulnerabilities(scan_id)"
        - "CREATE INDEX idx_vulnerabilities_project ON vulnerabilities(project_id)"
        - "CREATE INDEX idx_vulnerabilities_severity ON vulnerabilities(severity)"
        - "CREATE INDEX idx_vulnerabilities_status ON vulnerabilities(status)"
        - "CREATE INDEX idx_vulnerabilities_cve ON vulnerabilities(cve_id)"
        
  # Infrastructure Tables
  infrastructure_tables:
    
    infrastructure_resources:
      description: "Cloud Infrastructure resource tracking"
      columns:
        id:
          type: "UUID"
          primary_key: true
          default: "gen_random_uuid()"
        project_id:
          type: "UUID"
          foreign_key: "projects(id)"
        resource_id:
          type: "VARCHAR(255)"
          not_null: true
        resource_type:
          type: "VARCHAR(100)"
          not_null: true
        provider:
          type: "cloud_provider_enum"
          not_null: true
        region:
          type: "VARCHAR(50)"
        environment:
          type: "VARCHAR(50)"
        status:
          type: "resource_status_enum"
          not_null: true
        configuration:
          type: "JSONB"
          default: "'{}'"
        tags:
          type: "JSONB"
          default: "'{}'"
        cost_per_hour:
          type: "DECIMAL(10,4)"
        created_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
        updated_at:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
        terminated_at:
          type: "TIMESTAMP WITH TIME ZONE"
      constraints:
        - "UNIQUE(provider, resource_id)"
      indexes:
        - "CREATE INDEX idx_infrastructure_project ON infrastructure_resources(project_id)"
        - "CREATE INDEX idx_infrastructure_provider ON infrastructure_resources(provider)"
        - "CREATE INDEX idx_infrastructure_type ON infrastructure_resources(resource_type)"
        - "CREATE INDEX idx_infrastructure_status ON infrastructure_resources(status)"
        - "CREATE INDEX idx_infrastructure_tags ON infrastructure_resources USING GIN(tags)"
        
  # Audit and Logging Tables
  audit_tables:
    
    audit_logs:
      description: "System audit trail"
      columns:
        id:
          type: "UUID"
          primary_key: true
          default: "gen_random_uuid()"
        user_id:
          type: "UUID"
          foreign_key: "users(id)"
        action:
          type: "VARCHAR(100)"
          not_null: true
        resource_type:
          type: "VARCHAR(100)"
        resource_id:
          type: "UUID"
        old_values:
          type: "JSONB"
        new_values:
          type: "JSONB"
        ip_address:
          type: "INET"
        user_agent:
          type: "VARCHAR(500)"
        timestamp:
          type: "TIMESTAMP WITH TIME ZONE"
          default: "CURRENT_TIMESTAMP"
        metadata:
          type: "JSONB"
          default: "'{}'"
      indexes:
        - "CREATE INDEX idx_audit_logs_user ON audit_logs(user_id)"
        - "CREATE INDEX idx_audit_logs_action ON audit_logs(action)"
        - "CREATE INDEX idx_audit_logs_resource ON audit_logs(resource_type, resource_id)"
        - "CREATE INDEX idx_audit_logs_timestamp ON audit_logs(timestamp)"
        
# Database Enums
database_enums:
  
  team_role_enum:
    values: ["owner", "admin", "member", "viewer"]
    
  project_type_enum:
    values: ["web_app", "ml_pipeline", "hybrid_system", "firmware_edge", "native_app", "library"]
    
  git_provider_enum:
    values: ["github", "gitlab", "bitbucket", "azure_devops"]
    
  project_status_enum:
    values: ["active", "inactive", "archived", "deprecated"]
    
  deployment_status_enum:
    values: ["pending", "running", "succeeded", "failed", "cancelled", "rollback"]
    
  deployment_strategy_enum:
    values: ["rolling", "blue_green", "canary", "recreate"]
    
  trigger_type_enum:
    values: ["manual", "webhook", "schedule", "api", "cli"]
    
  step_status_enum:
    values: ["pending", "running", "succeeded", "failed", "skipped"]
    
  scan_type_enum:
    values: ["vulnerability", "dependency", "container", "Infrastructure", "code_quality"]
    
  scan_status_enum:
    values: ["pending", "running", "completed", "failed", "cancelled"]
    
  severity_enum:
    values: ["critical", "high", "medium", "low", "info"]
    
  vulnerability_status_enum:
    values: ["open", "in_progress", "resolved", "false_positive", "accepted_risk"]
    
  cloud_provider_enum:
    values: ["aws", "azure", "gcp", "digitalocean", "on_premises"]
    
  resource_status_enum:
    values: ["running", "stopped", "terminated", "pending", "error"]

# Redis Data Structures
redis_schema:
  
  session_storage:
    pattern: "session:{session_id}"
    type: "hash"
    ttl: 86400  # 24 hours
    fields:
      user_id: "UUID of authenticated user"
      username: "Username for display"
      teams: "JSON array of team memberships"
      permissions: "JSON array of user permissions"
      last_activity: "Timestamp of last activity"
      
  api_cache:
    pattern: "cache:api:{endpoint}:{params_hash}"
    type: "string"
    ttl: 3600  # 1 hour
    content: "JSON response data"
    
  rate_limiting:
    pattern: "ratelimit:{user_id}:{window}"
    type: "string"
    ttl: 3600  # 1 hour
    content: "Request count for time window"
    
  deployment_locks:
    pattern: "lock:deployment:{project_id}:{environment}"
    type: "string"
    ttl: 7200  # 2 hours
    content: "Deployment ID holding the lock"
    
  temporary_tokens:
    pattern: "token:{token_type}:{token_id}"
    type: "hash"
    ttl: 1800  # 30 minutes
    fields:
      user_id: "Associated user ID"
      purpose: "Token purpose (reset, verify, etc.)"
      created_at: "Token creation timestamp"
      metadata: "Additional token metadata"
      
  job_queues:
    pattern: "queue:{queue_name}"
    type: "list"
    content: "JSON job definitions for Celery"
    
  real_time_updates:
    pattern: "updates:{channel}:{subscriber_id}"
    type: "pubsub"
    content: "Real-time updates for WebSocket clients"

# InfluxDB Schema
influxdb_schema:
  
  measurements:
    
    deployment_metrics:
      description: "Deployment performance and success metrics"
      tags:
        project_id: "Project identifier"
        team: "Team name"
        environment: "Deployment environment"
        strategy: "Deployment strategy"
        status: "Deployment status"
      fields:
        duration: "Deployment duration in seconds"
        step_count: "Number of deployment steps"
        success: "Boolean success indicator"
        failure_reason: "Reason for failure (if applicable)"
      timestamp: "Deployment completion time"
      
    security_metrics:
      description: "Security scan results and vulnerability trends"
      tags:
        project_id: "Project identifier"
        scan_type: "Type of security scan"
        scanner: "Scanner tool name"
        severity: "Vulnerability severity"
      fields:
        vulnerability_count: "Number of vulnerabilities found"
        scan_duration: "Scan execution time in seconds"
        false_positive_rate: "Percentage of false positives"
        remediation_time: "Average time to fix vulnerabilities"
      timestamp: "Scan completion time"
      
    resource_utilization:
      description: "Infrastructure resource usage metrics"
      tags:
        project_id: "Project identifier"
        resource_type: "Type of resource"
        provider: "Cloud provider"
        region: "Geographic region"
        environment: "Environment name"
      fields:
        cpu_usage: "CPU utilization percentage"
        memory_usage: "Memory utilization percentage"
        disk_usage: "Disk utilization percentage"
        network_in: "Network bytes in"
        network_out: "Network bytes out"
        cost: "Hourly cost in USD"
      timestamp: "Measurement time"
      
    api_metrics:
      description: "API performance and usage metrics"
      tags:
        endpoint: "API endpoint path"
        method: "HTTP method"
        status_code: "HTTP response status"
        user_id: "User making the request"
      fields:
        response_time: "Response time in milliseconds"
        request_size: "Request size in bytes"
        response_size: "Response size in bytes"
      timestamp: "Request timestamp"

# Database Migrations
migrations:
  
  migration_strategy:
    tool: "Alembic (SQLAlchemy)"
    location: "migrations/"
    naming: "timestamp_description"
    
  migration_process:
    development:
      - "Create migration: alembic revision --autogenerate -m 'description'"
      - "Review generated migration"
      - "Apply migration: alembic upgrade head"
      
    production:
      - "Backup database before migration"
      - "Test migration on staging environment"
      - "Run migration during maintenance window"
      - "Verify migration success"
      - "Monitor Application health"
      
  rollback_procedure:
    - "Identify target revision"
    - "Stop Application services"
    - "Restore database backup if necessary"
    - "Run alembic downgrade to target revision"
    - "Restart services with previous version"
    
# Performance Optimization
performance:
  
  indexing_strategy:
    - "Primary keys on all tables"
    - "Foreign key indexes for joins"
    - "Composite indexes for common query patterns"
    - "Partial indexes for filtered queries"
    - "GIN indexes for JSONB columns"
    
  query_optimization:
    - "Use EXPLAIN ANALYZE for slow queries"
    - "Implement query result caching"
    - "Use connection pooling"
    - "Paginate large result sets"
    - "Use database views for complex queries"
    
  partitioning:
    audit_logs:
      strategy: "Range partitioning by timestamp"
      interval: "Monthly partitions"
      retention: "12 months"
      
    deployments:
      strategy: "Hash partitioning by project_id"
      partitions: 4
      
  maintenance:
    vacuum: "automated VACUUM ANALYZE on schedule"
    reindex: "Monthly REINDEX for heavily updated tables"
    statistics: "Daily statistics update"

# Backup and Recovery
backup_recovery:
  
  backup_strategy:
    full_backup:
      frequency: "Daily at 2 AM UTC"
      retention: "30 days"
      location: "S3 with cross-region replication"
      
    incremental_backup:
      frequency: "Every 6 hours"
      retention: "7 days"
      method: "WAL-E or pgBackRest"
      
    point_in_time_recovery:
      window: "35 days"
      archive_location: "S3 with versioning"
      
  disaster_recovery:
    rto: "2 hours"  # Recovery Time Objective
    rpo: "1 hour"   # Recovery Point Objective
    
    procedures:
      - "Failover to read replica"
      - "Promote replica to primary"
      - "Update Application configuration"
      - "Verify data integrity"
      - "Resume normal operations"
      
  testing:
    backup_restoration: "Monthly test restoration"
    disaster_recovery_drill: "Quarterly DR exercise"
    documentation_updates: "After each test"

# Security and Compliance
security:
  
  encryption:
    at_rest: "AES-256 encryption for all data"
    in_transit: "TLS 1.3 for all connections"
    key_management: "AWS KMS for encryption keys"
    
  access_control:
    Authentication: "Database user per Application component"
    authorization: "Row-level security policies"
    audit_logging: "All data access logged"
    
  compliance:
    gdpr:
      - "Data anonymization procedures"
      - "Right to be forgotten implementation"
      - "Data export capabilities"
      
    sox:
      - "Audit trail for all changes"
      - "Segregation of duties"
      - "Regular access reviews"
      
# Monitoring and Alerting
monitoring:
  
  database_metrics:
    - "Connection pool utilization"
    - "Query performance statistics"
    - "Lock contention monitoring"
    - "Replication lag tracking"
    - "Storage utilization"
    
  alerts:
    critical:
      - "Database connection failures"
      - "Replication lag > 5 minutes"
      - "Disk usage > 85%"
      - "Long-running transactions > 10 minutes"
      
    warning:
      - "Slow queries > 5 seconds"
      - "Connection pool > 80% utilization"
      - "Failed backup jobs"
      
  tools:
    - "PostgreSQL built-in statistics"
    - "pg_stat_statements extension"
    - "CloudWatch for RDS metrics"
    - "Custom monitoring dashboards"

# Development and Testing
development:
  
  local_setup:
    docker_compose:
      - "PostgreSQL container with test data"
      - "Redis container for caching"
      - "pgAdmin for database management"
      
    test_data:
      - "Synthetic user accounts"
      - "Sample projects and teams"
      - "Mock deployment history"
      - "Test security scan results"
      
  testing_strategy:
    unit_tests:
      - "Model validation tests"
      - "Repository pattern tests"
      - "Database constraint tests"
      
    integration_tests:
      - "End-to-end workflow tests"
      - "API integration tests"
