# PROJECT TECHNOLOGY STACK
# Project: SEGA - the fleet CLI for a whole portfolio of services
# File: docs/tech_stack.yaml
# Purpose: Complete technology stack documentation
# ================================

project:
  name: "SEGA"
  description: "The fleet CLI: one command grammar for your whole portfolio of services"
  tech_approach: "Cloud-native platform with microservices architecture and extensive tool integrations"

# Programming Languages
programming_languages:

  primary:
    python:
      version: "3.11+"
      purpose: "Backend services, CLI, automation scripts"
      frameworks:
        - "FastAPI (REST API development)"
        - "Click (CLI interface)"
        - "Pydantic (data validation)"
        - "SQLAlchemy (ORM)"
        - "Celery (task queuing)"
      testing:
        - "pytest (unit and integration testing)"
        - "pytest-cov (code coverage)"
        - "pytest-asyncio (async testing)"
      code_quality:

