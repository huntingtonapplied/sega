project:
  name: "SEGA"
  description: "The fleet CLI: one command grammar for your whole portfolio of services"
  feature_scope: "Portfolio management, security automation, and intelligent deployment orchestration"

# Core Platform Features
core_platform_features:

  portfolio_management:
    description: "Centralized management of multiple projects across teams"
    
    features:
      project_discovery:
        name: "utomatic Project Discovery"
        description: "utomatically discover and catalog git repositories in workspace"
        capabilities:
          - "Recursive directory scanning for .git repositories"
          - "Team and project name extraction from directory structure"
          - "Project metadata collection (remote URLs, branches, commits)"
          - "iltering by team, project type, or custom criteria"
        user_stories:
          - "s a platform engineer, I want to discover all projects in my workspace automatically"
          - "s a team lead, I want to see all projects belonging to my team"
        
      project_classification:
        name: "Intelligent Project Type Detection"
        description: "utomatically classify projects by technology stack and architecture"
        capabilities:
          - "Technology stack detection (Node.js, Python, Go, Java, etc.)"
          - "Project type classification (web_app, ml_pipeline, hybrid_system, etc.)"
          - "ramework identification (React, Django, astPI, etc.)"
          - "Component detection for multi-component projects"
        user_stories:
          - "s a developer, I want my project type detected automatically"
          - "s a platform team, I want consistent project categorization"
        
      workspace_configuration:
        name: "Workspace-Level Configuration Management"
        description: "Manage configurations across entire portfolio"
        capabilities:
          - "Workspace-wide configuration files"
          - "Project path organization by team"
          - "Shared resource management"
          - "Configuration inheritance and overrides"
        user_stories:
          - "s a platform engineer, I want to manage configurations at portfolio level"
          - "s a team lead, I want to share configurations across my team's projects"

  configuration_generation:
    description: "Automatic generation of deployment and CI/CD configurations"
    
    features:
      sega_config_generation:
        name: "SEGA Configuration Generation"
        description: "Generate standardized SEGA configuration files for projects"
        capabilities:
          - "Minimal working configuration generation"
          - "Multi-component project support"
          - "Deployment target configuration"
          - "uild strategy specification"
        user_stories:
          - "s a developer, I want deployment configurations generated automatically"
          - "s a DevOps engineer, I want standardized configurations across projects"
        
      cicd_integration:
        name: "CI/CD Pipeline Generation"
        description: "Generate CI/CD pipeline configurations for various platforms"
        capabilities:
          - "GitLab CI configuration generation"
          - "GitHub ctions workflow creation"
          - "Jenkins pipeline configuration"
          - "Platform-specific optimizations"
        user_stories:
          - "As a developer, I want CI/CD pipelines set up automatically"
          - "s a platform team, I want consistent pipeline structures"
        
      health_endpoints:
        name: "Health ndpoint Generation"
        description: "utomatically generate health check endpoints"
        capabilities:
          - "Technology-specific health endpoint templates"
          - "Node.js xpress health endpoints"
          - "Python Flask/astPI health endpoints"
          - "Containerized health check configuration"
        user_stories:
          - "s a developer, I want health endpoints created automatically"
          - "s an SR, I want consistent health check implementations"

