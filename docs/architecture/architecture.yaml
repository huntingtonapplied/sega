  design_principles:
    - "Security by design"
    - "Cloud-native first"
    - "PI-driven architecture"
    - "Immutable infrastructure"
    - "Observability from day one"
    
  architecture_review:
    frequency: "Quarterly architecture review board"
    criteria: "Performance, security, maintainability, cost"
    stakeholders: "Engineering leads, security team, platform team"
    
  technical_debt:
    tracking: "Technical debt register with prioritization"
    allocation: "% of sprint capacity for technical debt"
    metrics: "Code quality metrics and performance benchmarks"